*{box-sizing:border-box}

<script>
const WA="19515122172";
let lang=localStorage.getItem("rockLang")||"en";
const wa=(m)=>"https://wa.me/"+WA+"?text="+encodeURIComponent(m);

function applyLang(l){
  lang=l;
  localStorage.setItem("rockLang",lang);
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-en]").forEach(el=>{
    el.textContent=lang==="ar"?el.dataset.ar:el.dataset.en;
  });
  document.getElementById("langBtn").textContent=lang==="ar"?"EN":"عربي";
  document.getElementById("floatingWa").textContent=lang==="ar"?"واتساب":"WhatsApp";

  document.getElementById("contactTop").href=wa(lang==="ar"?"مرحباً، أريد معلومات أكثر عن THE ROCK TV":"Hello, I want more information about THE ROCK TV");
  document.getElementById("floatingWa").href="https://wa.me/"+WA;
  document.getElementById("sportLink").href=wa(lang==="ar"?"مرحباً، أرسل لي قائمة القنوات الرياضية":"Hello, please send me the sports channel list");
  document.getElementById("movieLink").href=wa(lang==="ar"?"مرحباً، أرسل لي تفاصيل الأفلام والمسلسلات":"Hello, please send me details about movies and series");
  document.getElementById("arabicLink").href=wa(lang==="ar"?"مرحباً، أرسل لي تفاصيل الترفيه العربي":"Hello, please send me details about Arabic entertainment");
  document.getElementById("musicLink").href=wa(lang==="ar"?"مرحباً، أرسل لي تفاصيل قنوات الموسيقى":"Hello, please send me details about music channels");

  document.querySelectorAll("[data-plan]").forEach(a=>{
    const p=a.dataset.plan,price=a.dataset.price;
    a.href=wa(lang==="ar"?`مرحباً، أريد اشتراك ${p} بسعر ${price}`:`Hello, I want ${p} ${price}`);
  });
}
document.getElementById("langBtn").addEventListener("click",()=>applyLang(lang==="en"?"ar":"en"));
applyLang(lang);
</script>
