<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE ROCK TV | Premium IPTV</title>
<meta name="description" content="THE ROCK TV IPTV packages with live TV, sports, movies and series. Contact us on WhatsApp for package details and support.">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#03111f">
<meta property="og:title" content="THE ROCK TV | Premium IPTV">
<meta property="og:description" content="Explore THE ROCK TV IPTV packages and contact us directly on WhatsApp.">
<meta property="og:type" content="website">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0;background:#03111f}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
.site{max-width:1400px;margin:0 auto;background:#03111f}
.navbar{
  background:#061322;border-bottom:1px solid rgba(232,188,78,.45);
  min-height:78px;display:flex;align-items:center;padding:0 4.5%;gap:28px;
  position:sticky;top:0;z-index:50;
}
.logo{color:#f3c84f;font-weight:900;line-height:.95;font-size:24px;min-width:150px}
.logo small{display:block;color:#fff;font-size:11px;letter-spacing:1.4px;margin-top:7px}
.navlinks{display:flex;gap:26px;align-items:center;justify-content:center;flex:1}
.navlinks a{color:#fff;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.navlinks a:hover{color:#f3c84f}
.lang{border:1px solid #d6aa3d;border-radius:999px;background:transparent;color:#f3cf6a;padding:9px 16px;font-weight:900;cursor:pointer}
.page{position:relative}
.poster{display:block;width:100%;height:auto}
.anchor{position:absolute;left:0;width:1px;height:1px}
#home{top:0} #channels{top:27%} #movies{top:27%} #sports{top:27%} #packages{top:50%}
.hotspot{position:absolute;z-index:10;display:block;border-radius:12px}
.hotspot:hover{outline:2px solid rgba(255,215,70,.7);background:rgba(255,215,70,.04)}
.dino{left:2.6%;top:76.15%;width:21.5%;height:4.7%;cursor:pointer;z-index:35}
.magic{left:27.2%;top:76.15%;width:21.5%;height:4.7%;cursor:pointer;z-index:35}
.zein{left:51.7%;top:76.15%;width:21.5%;height:4.7%;cursor:pointer;z-index:35}
.strong{left:76.1%;top:76.15%;width:21.0%;height:4.7%;cursor:pointer;z-index:35}
.cat-sports{left:1.5%;top:29.2%;width:23.3%;height:18.4%}
.cat-movies{left:25.8%;top:29.2%;width:23.3%;height:18.4%}
.cat-arabic{left:50.1%;top:29.2%;width:23.3%;height:18.4%}
.cat-music{left:74.4%;top:29.2%;width:23.3%;height:18.4%}
.floating-wa{
 position:fixed;right:18px;bottom:18px;z-index:70;background:#19c463;color:#fff;
 text-decoration:none;font-weight:900;padding:13px 18px;border-radius:999px;
 box-shadow:0 8px 25px rgba(0,0,0,.35)
}
.contact-card{
  margin:34px auto 48px;max-width:760px;padding:28px;
  border:1px solid rgba(232,188,78,.45);border-radius:22px;
  background:#071421;text-align:center;box-shadow:0 14px 35px rgba(0,0,0,.22)
}
.contact-card h2{margin:0 0 8px;color:#f3c84f;font-size:28px}
.contact-card p{margin:7px 0;line-height:1.5}
.qr{width:220px;max-width:70vw;border-radius:14px;background:#fff;padding:10px;margin:18px auto;display:block}
.wa-btn{
 display:inline-block;background:#19c463;color:#fff;text-decoration:none;
 font-weight:900;padding:13px 20px;border-radius:999px;margin-top:8px
}
.phone{font-weight:900;color:#f3cf6a;direction:ltr;display:inline-block}
[dir="rtl"] .navbar{direction:rtl}
[dir="rtl"] .navlinks{direction:rtl}
@media(max-width:820px){
  .navbar{padding:8px 10px;gap:10px;min-height:64px}
  .logo{font-size:18px;min-width:auto}
  .logo small{font-size:9px}
  .navlinks{gap:12px;overflow-x:auto;justify-content:flex-start}
  .navlinks a{font-size:11px}
  .lang{padding:7px 12px;font-size:12px}
  .floating-wa{right:10px;bottom:10px;padding:11px 14px;font-size:14px}
  .contact-card{margin:22px 12px 38px;padding:22px 16px}
}
</style>
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"Organization",
  "name":"THE ROCK TV",
  "contactPoint":{
    "@type":"ContactPoint",
    "telephone":"+20 122 414 2081",
    "contactType":"customer service"
  }
}
</script>
</head>
<body>
<div class="site">
  <header class="navbar">
    <div class="logo">THE ROCK<br>TV<small data-en="PREMIUM IPTV" data-ar="IPTV مميز">PREMIUM IPTV</small></div>
    <nav class="navlinks">
      <a href="#home" data-en="Home" data-ar="الرئيسية">Home</a>
      <a href="#packages" data-en="Packages" data-ar="الباقات">Packages</a>
      <a href="#channels" data-en="Channels" data-ar="القنوات">Channels</a>
      <a href="#movies" data-en="Movies & Series" data-ar="أفلام ومسلسلات">Movies & Series</a>
      <a href="#sports" data-en="Sports" data-ar="رياضة">Sports</a>
      <a id="contactTop" target="_blank" rel="noopener" data-en="Contact" data-ar="تواصل معنا">Contact</a>
    </nav>
    <button class="lang" id="langBtn" type="button">عربي</button>
  </header>

  <div class="page">
    <span id="home" class="anchor"></span>
    <span id="channels" class="anchor"></span>
    <span id="movies" class="anchor"></span>
    <span id="sports" class="anchor"></span>
    <span id="packages" class="anchor"></span>

    <img class="poster" src="poster-v4.jpg" alt="THE ROCK TV IPTV packages, entertainment and sports">

    <a class="hotspot cat-sports" id="sportLink" target="_blank" rel="noopener" aria-label="Sports channels"></a>
    <a class="hotspot cat-movies" id="movieLink" target="_blank" rel="noopener" aria-label="Movies and series"></a>
    <a class="hotspot cat-arabic" id="arabicLink" target="_blank" rel="noopener" aria-label="Arabic entertainment"></a>
    <a class="hotspot cat-music" id="musicLink" target="_blank" rel="noopener" aria-label="Music channels"></a>
<a class="hotspot magic" data-plan="Magic TV" data-price="$55/year" target="_blank" rel="noopener" aria-label="Order Magic TV"></a>
    <a class="hotspot dino" data-plan="DINO" data-price="$45/year" target="_blank" rel="noopener" aria-label="Order DINO"></a>
    <a class="hotspot zein" data-plan="Zein" data-price="$60/year" target="_blank" rel="noopener" aria-label="Order Zein"></a>
    <a class="hotspot strong" data-plan="STRONG" data-price="$70/year" target="_blank" rel="noopener" aria-label="Order STRONG"></a>
  </div>

  <section class="contact-card" id="contact">
    <h2 data-en="Contact The Rock TV" data-ar="تواصل مع The Rock TV">Contact The Rock TV</h2>
    <p data-en="Scan the QR code or tap the WhatsApp button to contact us." data-ar="امسح الكود أو اضغط على زر واتساب للتواصل معنا.">Scan the QR code or tap the WhatsApp button to contact us.</p>
    <img class="qr" src="whatsapp-qr.png" alt="The Rock TV WhatsApp QR code">
    <p><span data-en="WhatsApp:" data-ar="واتساب:">WhatsApp:</span> <span class="phone">+20 122 414 2081</span></p>
    <a class="wa-btn" id="contactButton" target="_blank" rel="noopener" data-en="Chat on WhatsApp" data-ar="تواصل عبر واتساب">Chat on WhatsApp</a>
    <p data-en="We received your message and will get back to you as soon as possible." data-ar="استلمنا رسالتك وهنرد عليك في أقرب وقت ممكن.">We received your message and will get back to you as soon as possible.</p>
  </section>
</div>

<a class="floating-wa" id="floatingWa" target="_blank" rel="noopener">WhatsApp</a>

<script>
const WA="201224142081";
let lang=localStorage.getItem("rockLang")||"en";
const wa=(m)=>"https://wa.me/"+WA+"?text="+encodeURIComponent(m);

function applyLang(l){
  lang=l;
  localStorage.setItem("rockLang",lang);
  document.documentElement.lang=lang;
  document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-en]").forEach(el=>{
    el.textContent=lang==="ar"?el.dataset.ar:el.dataset.en;
  });
  document.getElementById("langBtn").textContent=lang==="ar"?"EN":"عربي";
  document.getElementById("floatingWa").textContent=lang==="ar"?"واتساب":"WhatsApp";

  const generalMsg=lang==="ar"
    ?"مرحباً، أريد معلومات أكثر عن THE ROCK TV"
    :"Hello, I want more information about THE ROCK TV";

  document.getElementById("contactTop").href=wa(generalMsg);
  document.getElementById("contactButton").href=wa(generalMsg);
  document.getElementById("floatingWa").href=wa(generalMsg);

  document.getElementById("sportLink").href=wa(lang==="ar"?"مرحباً، أرسل لي قائمة القنوات الرياضية":"Hello, please send me the sports channel list");
  document.getElementById("movieLink").href=wa(lang==="ar"?"مرحباً، أرسل لي تفاصيل الأفلام والمسلسلات":"Hello, please send me details about movies and series");
  document.getElementById("arabicLink").href=wa(lang==="ar"?"مرحباً، أرسل لي تفاصيل الترفيه العربي":"Hello, please send me details about Arabic entertainment");
  document.getElementById("musicLink").href=wa(lang==="ar"?"مرحباً، أرسل لي تفاصيل قنوات الموسيقى":"Hello, please send me details about music channels");

  document.querySelectorAll("[data-plan]").forEach(a=>{
    const p=a.dataset.plan,price=a.dataset.price;
    a.href=wa(
      `Hello, I want to order the ${p} package for ${price}.\n` +
      `مرحباً، أريد طلب باقة ${p} بسعر ${price}.`
    );
  });
}
document.getElementById("langBtn").addEventListener("click",()=>applyLang(lang==="en"?"ar":"en"));
applyLang(lang);
</script>
</body>
</html>
