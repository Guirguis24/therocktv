<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">

<title>THE ROCK TV</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#03111f}
body{font-family:Arial,Helvetica,sans-serif}
.site{max-width:1400px;margin:0 auto;background:#03111f}
.navbar{
  background:#061322;border-bottom:1px solid rgba(232,188,78,.45);
  min-height:78px;display:flex;align-items:center;padding:0 4.5%;gap:28px;
  position:sticky;top:0;z-index:50;
}
.logo{color:#f3c84f;font-weight:900;line-height:.95;font-size:24px;min-width:150px}
.logo small{display:block;color:#fff;font-size:11px;letter-spacing:1.4px;margin-top:7px}
.navlinks{display:flex;gap:26px;align-items:center;justify-content:center;flex:1}
.navlinks a{color:#fff;text-decoration:none;font-weight:700;font-size:14px;white-space:nowrap}
.navlinks a:hover{color:#f3c84f}
.lang{border:1px solid #d6aa3d;border-radius:999px;background:transparent;color:#f3cf6a;padding:9px 16px;font-weight:900;cursor:pointer}
.page{position:relative}
.poster{display:block;width:100%;height:auto}
.anchor{position:absolute;left:0;width:1px;height:1px}
#home{top:0} #channels{top:27%} #movies{top:27%} #sports{top:27%} #packages{top:50%}
.hotspot{position:absolute;z-index:10;display:block;border-radius:12px}
.hotspot:hover{outline:2px solid rgba(255,215,70,.7);background:rgba(255,215,70,.04)}
.magic{left:2.4%;top:72.0%;width:22.0%;height:8.5%;cursor:pointer;z-index:30}
.dino{left:27.0%;top:72.0%;width:22.0%;height:8.5%;cursor:pointer;z-index:30}
.zein{left:51.4%;top:72.0%;width:22.0%;height:8.5%;cursor:pointer;z-index:30}
.strong{left:75.8%;top:72.0%;width:22.0%;height:8.5%;cursor:pointer;z-index:30}
.cat-sports{left:1.5%;top:29.2%;width:23.3%;height:18.4%}
.cat-movies{left:25.8%;top:29.2%;width:23.3%;height:18.4%}
.cat-arabic{left:50.1%;top:29.2%;width:23.3%;height:18.4%}
.cat-music{left:74.4%;top:29.2%;width:23.3%;height:18.4%}
.floating-wa{
 position:fixed;right:18px;bottom:18px;z-index:70;background:#19c463;color:#fff;
 text-decoration:none;font-weight:900;padding:13px 18px;border-radius:999px;
 box-shadow:0 8px 25px rgba(0,0,0,.35)
}
[dir="rtl"] .navbar{direction:rtl}
[dir="rtl"] .navlinks{direction:rtl}
@media(max-width:820px){
  .navbar{padding:8px 10px;gap:10px;min-height:64px}
  .logo{font-size:18px;min-width:auto}
  .logo small{font-size:9px}
  .navlinks{gap:12px;overflow-x:auto;justify-content:flex-start}
  .navlinks a{font-size:11px}
  .lang{padding:7px 12px;font-size:12px}
  .floating-wa{right:10px;bottom:10px;padding:11px 14px;font-size:14px}
}

.price-fix{
  position:absolute;z-index:14;top:72.55%;height:2.35%;
  display:flex;align-items:center;justify-content:center;
  background:#071421;color:#e9b43c;font-weight:900;
  font-size:clamp(18px,2.6vw,38px);line-height:1;border-radius:6px;
}
.price-fix span{color:#fff;font-size:.55em;margin-left:7px;font-weight:800}
.magic-price{left:7.0%;width:15.5%}
.dino-price{left:31.1%;width:15.5%}

</style>
